name: Update contribution count
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  # Pushes go over the deploy key; the token only reads the GraphQL API
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No job-wide credentials: the deploy key is loaded only in the
          # push step below.
          persist-credentials: false
      - name: Fetch last-year contributions and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh api graphql -f query='{ user(login: "Tatendaz"){ contributionsCollection { contributionCalendar { totalContributions } } } }' --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "fetched count: $COUNT"
          # Guard: only write a positive integer (never overwrite with empty/0 on a transient error)
          if ! echo "$COUNT" | grep -qE '^[1-9][0-9]*$'; then
            echo "Invalid count ('$COUNT') — leaving README unchanged."
            exit 0
          fi
          perl -0pi -e "s/(<!--CONTRIB_START-->).*?(<!--CONTRIB_END-->)/\${1}${COUNT}\${2}/s" README.md
      - name: Commit if changed
        env:
          REF_NAME: ${{ github.ref_name }}
          # Deploy key, not GITHUB_TOKEN: main's ruleset requires image-health,
          # and only deploy keys can bypass it on a personal repo. Scoped to
          # this step only.
          DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh contribution count [skip ci]"
            umask 077
            printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:${REF_NAME}"
            rm -f "$RUNNER_TEMP/deploy_key"
          else
            echo "No change."
          fi
