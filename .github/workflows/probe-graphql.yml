name: "Probe: raw GraphQL/REST with GITHUB_TOKEN"
# Temporary experiment — DELETE BEFORE MERGE.
# Prints exactly what the Actions token gets back for the queries the pin
# cards depend on, errors included.
on:
  push:
    branches: [fix/no-error-cards-guard]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "GraphQL: user -> repository (pin card shape)"
        run: |
          curl -sS https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -d '{"query":"query { user(login: \"Tatendaz\") { login repository(name: \"yapui\") { name isPrivate stargazers { totalCount } } } }"}' | jq .
      - name: "GraphQL: direct repository(owner, name)"
        run: |
          curl -sS https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -d '{"query":"query { repository(owner: \"Tatendaz\", name: \"yapui\") { name isPrivate stargazers { totalCount } } }"}' | jq .
      - name: "GraphQL: viewer + rateLimit"
        run: |
          curl -sS https://api.github.com/graphql \
            -H "Authorization: bearer $GH_TOKEN" \
            -d '{"query":"query { viewer { login } rateLimit { remaining limit } }"}' | jq .
      - name: "REST: /repos/Tatendaz/yapui"
        run: |
          curl -sS -o /tmp/rest.json -w 'HTTP %{http_code}\n' \
            -H "Authorization: bearer $GH_TOKEN" \
            https://api.github.com/repos/Tatendaz/yapui
          jq '{full_name, visibility, stargazers_count}' /tmp/rest.json || cat /tmp/rest.json
