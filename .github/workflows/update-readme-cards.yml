name: Update README cards
on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: update-readme-cards
  cancel-in-progress: false
jobs:
  update:
    # Only branch refs (and only main): a dispatch from a tag must not push there
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      # Pushes go over the deploy key; the token only reads stats APIs
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # No job-wide credentials: the third-party card actions below must
          # never see the deploy key. It is loaded only in the push step.
          persist-credentials: false
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: username=Tatendaz&layout=compact&hide_border=true&langs_count=8&hide=html,css&theme=tokyonight
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate yapui pin card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: pin
          options: username=Tatendaz&repo=yapui&hide_border=true&theme=tokyonight
          path: assets/pin-yapui.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate langchain-fde-curriculum pin card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: pin
          options: username=Tatendaz&repo=langchain-fde-curriculum&hide_border=true&theme=tokyonight
          path: assets/pin-langchain-fde-curriculum.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Vergance pin card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: pin
          options: username=Tatendaz&repo=Vergance&hide_border=true&theme=tokyonight
          path: assets/pin-vergance.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate claude-usage pin card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: pin
          options: username=Tatendaz&repo=claude-usage&hide_border=true&theme=tokyonight
          path: assets/pin-claude-usage.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate promptups pin card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: pin
          options: username=Tatendaz&repo=promptups&hide_border=true&theme=tokyonight
          path: assets/pin-promptups.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        env:
          REF_NAME: ${{ github.ref_name }}
          # Deploy key, not GITHUB_TOKEN: main's ruleset requires image-health,
          # and only deploy keys can bypass it on a personal repo. Scoped to
          # this step only.
          DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          if [ -n "$(git status --porcelain assets/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "chore: refresh README cards [skip ci]"
            git fetch origin "${REF_NAME}"
            git rebase "origin/${REF_NAME}"
            # mktemp: atomic 0600 create (a pre-planted symlink can't redirect
            # the write); EXIT trap: key never survives a failed push
            key_file=$(mktemp "$RUNNER_TEMP/deploy_key.XXXXXX")
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$DEPLOY_KEY" > "$key_file"
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:${REF_NAME}"
          else
            echo "No change."
          fi
