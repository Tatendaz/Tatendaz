name: Update README cards
on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: update-readme-cards
  cancel-in-progress: false
jobs:
  update:
    # Only branch refs (and only main): a dispatch from a tag must not push there
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      # Pushes go over the deploy key; the token only reads stats APIs
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No job-wide credentials: the third-party card actions below must
          # never see the deploy key. It is loaded only in the push step.
          persist-credentials: false
      # Two variants per card: the README serves assets/<card>.svg in GitHub's
      # dark theme and assets/<card>-light.svg in the light theme (<picture> +
      # prefers-color-scheme). Colors match tatendaz.github.io.
      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: username=Tatendaz&layout=compact&hide_border=true&langs_count=8&hide=html,css,solidity&title_color=E07A52&text_color=ECECEE&bg_color=1D1D1F
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: username=Tatendaz&layout=compact&hide_border=true&langs_count=8&hide=html,css,solidity&title_color=B0502E&text_color=1A1613&bg_color=FCFBF7
          path: assets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned core renderer
        # Own step so the GITHUB_TOKEN is never in npm's environment;
        # --ignore-scripts keeps third-party install hooks from running.
        # npm ci from the committed lockfile: every transitive version and
        # integrity hash is fixed, so a freshly published (possibly
        # malicious) dependency release can't slip into this job, which
        # later loads the deploy key.
        run: |
          mkdir -p "$RUNNER_TEMP/statsenv"
          cp scripts/statsenv/package.json scripts/statsenv/package-lock.json "$RUNNER_TEMP/statsenv/"
          npm ci --prefix "$RUNNER_TEMP/statsenv" --no-audit --no-fund --ignore-scripts
      - name: Generate pin cards (REST + core renderer)
        # Not the stats action: since 2026-07-22 GitHub returns FORBIDDEN
        # ("Resource not accessible by integration") for the GraphQL
        # `stargazers` field on repos outside this token's installation, so
        # the action's pin cards all render as error cards. REST still serves
        # the same fields to the same token; scripts/render_pin.mjs feeds
        # them to the identical core renderer (byte-identical output).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export STATS_CORE_DIR="$RUNNER_TEMP/statsenv/node_modules/@stats-organization/github-readme-stats-core"
          # Lowercase names: GitHub resolves repo names case-insensitively,
          # and the asset paths in README.md are lowercase.
          for repo in coderabbit-failover codeandconfirm mission-control model-picker t-mods quotasignal herdr-launcher claude-usage; do
            gh api "repos/Tatendaz/$repo" > "$RUNNER_TEMP/$repo.json"
            node scripts/render_pin.mjs dark < "$RUNNER_TEMP/$repo.json" > "assets/pin-$repo.svg"
            node scripts/render_pin.mjs light < "$RUNNER_TEMP/$repo.json" > "assets/pin-$repo-light.svg"
          done
      - name: Never commit error cards
        id: sanitize
        # The stats action exits 0 even when the API returns an error, writing
        # an error-card SVG (seen 2026-07-22: all 5 pin cards shipped as "User
        # Repository Not found" error cards). Match the error card's unique
        # data-testid="message" node — body text like "Something went wrong"
        # could legitimately appear in a repo description. Keep the
        # previous good version instead; a new card with no good version to
        # fall back to is deleted so the breakage shows up as a 404 the health
        # check already catches.
        run: |
          bad=0
          for f in assets/*.svg; do
            if grep -q 'data-testid="message"' "$f"; then
              echo "::warning file=$f::generated card is an error card; keeping the previous good version"
              git checkout -- "$f" 2>/dev/null || rm -f -- "$f"
              bad=1
            fi
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        env:
          REF_NAME: ${{ github.ref_name }}
          # Deploy key, not GITHUB_TOKEN: main's ruleset requires image-health,
          # and only deploy keys can bypass it on a personal repo. Scoped to
          # this step only.
          DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          if [ -n "$(git status --porcelain assets/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/
            git commit -m "chore: refresh README cards [skip ci]"
            git fetch origin "${REF_NAME}"
            git rebase "origin/${REF_NAME}"
            # mktemp: atomic 0600 create (a pre-planted symlink can't redirect
            # the write); EXIT trap: key never survives a failed push
            key_file=$(mktemp "$RUNNER_TEMP/deploy_key.XXXXXX")
            trap 'rm -f "$key_file"' EXIT
            printf '%s\n' "$DEPLOY_KEY" > "$key_file"
            GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:${GITHUB_REPOSITORY}.git" "HEAD:${REF_NAME}"
          else
            echo "No change."
          fi
      - name: Fail if any generator produced an error card
        # After the commit so good cards still refresh, but the run goes red
        # and scheduled-run failure notifications fire.
        if: steps.sanitize.outputs.bad == '1'
        run: |
          echo "::error::A card generator returned an error card; its previous good version was kept. See warnings above."
          exit 1
