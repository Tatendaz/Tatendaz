version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and
  # its "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait 7 days after a release before proposing it (security updates skip this).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pin-card renderer installed by update-readme-cards.yml.
  - package-ecosystem: npm
    directory: /scripts/statsenv
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
