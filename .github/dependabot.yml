version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and
  # its "# vX.Y.Z" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait 7 days after a release before proposing it (security updates skip this).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # The stats action runs in update-readme-cards.yml, the job that loads the
    # write deploy key, and merge-when-clean.yml would merge its bumps
    # unattended. No version-update PRs for it: the owner bumps the SHA by hand.
    ignore:
      - dependency-name: stats-organization/github-readme-stats-action
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The pin-card renderer installed by update-readme-cards.yml. It runs in the
  # job that loads the write deploy key, so its bumps wait for the owner:
  # merge-when-clean.yml skips PRs labelled needs-owner.
  - package-ecosystem: npm
    directory: /scripts/statsenv
    labels: [dependencies, needs-owner]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
